<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Corefall: A Click Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cenário de fundo: campo gramado com borboletas -->
  <div class="scene-bg" aria-hidden="true">
    <div id="flowers-layer" class="flowers-layer"></div>

    <div class="butterfly butterfly-1">
      <span class="wing wing-left"></span>
      <span class="wing wing-right"></span>
    </div>
    <div class="butterfly butterfly-2">
      <span class="wing wing-left"></span>
      <span class="wing wing-right"></span>
    </div>
    <div class="butterfly butterfly-3">
      <span class="wing wing-left"></span>
      <span class="wing wing-right"></span>
    </div>
    <div class="butterfly butterfly-4">
      <span class="wing wing-left"></span>
      <span class="wing wing-right"></span>
    </div>
    <div class="butterfly butterfly-5">
      <span class="wing wing-left"></span>
      <span class="wing wing-right"></span>
    </div>
  </div>

  <!-- Tela Inicial -->
  <section id="home-screen" class="screen active">
    <div class="home-col home-col-left">
      <h1 class="logo">Corefall<span class="tagline">a click adventure</span></h1>
      <p class="version">v0.1 - GDD Base</p>
      <button id="btn-stats" class="hud-btn">Estatísticas</button>
    </div>

    <div class="core-visual" aria-hidden="true">
      <div class="core-button"></div>
    </div>

    <div class="menu">
      <button id="btn-play" class="menu-btn btn-play">Jogar</button>
      <button id="btn-share" class="menu-btn btn-share">Compartilhar</button>
      <button id="btn-ranking" class="menu-btn btn-ranking">Ranking Global</button>
    </div>
  </section>

  <!-- Modal: escolher nome -->
  <div id="name-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Escolha seu nome</h2>
      <input id="name-input" type="text" maxlength="16" placeholder="Digite seu nome" />
      <div class="modal-actions">
        <button id="btn-cancel-name" class="menu-btn">Cancelar</button>
        <button id="btn-confirm-name" class="menu-btn primary">Entrar</button>
      </div>
    </div>
  </div>

  <!-- Modal: ranking (global, via Firebase) -->
  <div id="ranking-modal" class="modal hidden">
    <div class="modal-box inventory-box">
      <h2>Ranking Global</h2>
      <p class="placeholder-text">Menor tempo pra completar as 10 barras, de todos os jogadores</p>
      <div id="ranking-list" class="inventory-list"></div>
      <div class="modal-actions">
        <button id="btn-close-ranking" class="menu-btn primary">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Modal: baú -->
  <div id="chest-modal" class="modal hidden">
    <div class="modal-box chest-box">
      <h2 id="chest-title">Baú Comum!</h2>
      <button id="chest-btn" class="chest-btn" aria-label="Abrir baú"></button>
      <div id="chest-reward" class="hidden">
        <div class="reward-row">
          <img src="sprites/coin.png" class="reward-icon" alt="Ouro" />
          <span id="chest-gold-text" class="placeholder-text">+0 ouro</span>
        </div>
        <div class="reward-row">
          <img id="chest-item-icon" class="reward-icon hidden" alt="" />
          <span id="chest-item-text" class="placeholder-text"></span>
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-close-chest" class="menu-btn primary hidden">Continuar</button>
      </div>
    </div>
  </div>

  <!-- Modal: estatísticas (painel local do dev) -->
  <div id="stats-modal" class="modal hidden">
    <div class="modal-box inventory-box">
      <h2>Estatísticas</h2>
      <p class="placeholder-text">Dados registrados neste aparelho</p>
      <div id="stats-list" class="inventory-list"></div>
      <div class="modal-actions">
        <button id="btn-close-stats" class="menu-btn primary">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Modal: inventário -->
  <div id="inventory-modal" class="modal hidden">
    <div class="modal-box inventory-box">
      <h2>Inventário</h2>
      <p id="equipped-display" class="placeholder-text">Arma equipada: Nenhuma</p>
      <div id="inventory-list" class="inventory-list"></div>
      <div class="modal-actions">
        <button id="btn-close-inventory" class="menu-btn primary">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Tela da fase -->
  <section id="game-screen" class="screen hidden">
    <div class="phase-hud">
      <p class="player-tag">Aventureiro: <span id="player-name-display"></span></p>
      <p id="gold-counter" class="bar-counter">Ouro: 0</p>
      <p id="bar-counter" class="bar-counter">Barras completas: 0/10</p>
      <button id="btn-inventory" class="hud-btn">Inventário</button>
      <button id="btn-back-menu" class="hud-btn hidden">Voltar ao Menu</button>
    </div>

    <div class="core-visual">
      <button id="core-btn" class="core-button" aria-label="Clicar no Núcleo"></button>
    </div>

    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
  </section>

  <script type="module" src="script.js"></script>
</body>
</html>
